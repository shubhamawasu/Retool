[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["default", "macros"] }
axum-login = "0.18.0"
dotenvy = "0.15"
tokio = { version = "1.53.1", features = ["full"] }
tower-sessions = "0.14.0" # Required for axum-login
time = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
trait-variant = "0.1.3"

[dev-dependencies]
axum-test = "21.0.0"
